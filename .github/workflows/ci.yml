name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Pin the declared npm version
        run: |
          npm install --global npm@10.9.8 --ignore-scripts
          test "$(npm --version)" = "10.9.8"

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: npm ci

      # The deterministic TypeScript suite is platform-independent. This
      # Linux-only test install uses --force to bypass the root package's macOS
      # publish guard; release/package jobs use normal installs, and no Linux
      # artifact ships.
      - name: Install dependencies for Linux checks
        if: runner.os == 'Linux'
        run: npm ci --force

      - name: Run deterministic checks
        run: npm run check

  package:
    name: Inspect npm package
    needs: test
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Pin the declared npm version
        run: |
          npm install --global npm@10.9.8 --ignore-scripts
          test "$(npm --version)" = "10.9.8"

      - name: Install dependencies
        run: npm ci

      - name: Build and inspect the dry-run package
        shell: bash
        run: |
          npm pack --dry-run --json > package-report.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const reports = JSON.parse(readFileSync("package-report.json", "utf8"));
          if (!Array.isArray(reports) || reports.length !== 1) {
            throw new Error("Expected exactly one npm package report");
          }

          const [report] = reports;
          const expectedFilename = `${pkg.name.replace(/^@/, "").replaceAll("/", "-")}-${pkg.version}.tgz`;
          if (report.name !== pkg.name || report.version !== pkg.version) {
            throw new Error("npm package identity does not match package.json");
          }
          if (report.filename !== expectedFilename) {
            throw new Error(`Unexpected package filename: ${report.filename}`);
          }

          const paths = new Set(report.files.map(({ path }) => path));
          if (paths.size !== report.files.length) {
            throw new Error("npm package report contains duplicate paths");
          }

          const exactPaths = new Set([
            "CHANGELOG.md",
            "CONTRIBUTING.md",
            "LICENSE",
            "README.md",
            "SECURITY.md",
            "docs/GATEWAY-ARCHITECTURE.md",
            "package.json",
            "skills/embassy-peer/SKILL.md",
            "skills/embassy-peer/agents/openai.yaml",
          ]);
          const exactLocaleRuntimePaths = new Set([
            "dist/src/gateway/dashboard-copy.en.d.ts",
            "dist/src/gateway/dashboard-copy.en.js",
            "dist/src/gateway/dashboard-copy.en.js.map",
            "dist/src/gateway/dashboard-copy.zh-CN.d.ts",
            "dist/src/gateway/dashboard-copy.zh-CN.js",
            "dist/src/gateway/dashboard-copy.zh-CN.js.map",
          ]);
          const requiredPaths = [
            ...exactPaths,
            "dist/src/gateway/cli.js",
            "dist/src/gateway/dashboard-copy.js",
            "dist/src/gateway/dashboard-copy.en.js",
            "dist/src/gateway/dashboard-copy.zh-CN.js",
            "dist/src/gateway/dashboard-model.js",
            "dist/src/gateway/live-dashboard.js",
            "dist/src/gateway/live-dashboard-assets.js",
            "dist/src/gateway/live-dashboard-bootstrap.js",
            "dist/src/gateway/live-dashboard-command.js",
            "dist/src/gateway/live-dashboard-http.js",
            "dist/src/gateway/live-dashboard-protocol.js",
            "dist/src/gateway/live-dashboard-server.js",
            "dist/src/gateway/live-dashboard-stream.js",
            "dist/src/gateway/server.js",
          ];
          const allowedRuntimePath =
            /^(?:dist\/src\/gateway\/[a-z0-9-]+\.(?:d\.ts|js|js\.map)|dist\/src\/(?:errors|mutex)\.(?:d\.ts|js|js\.map))$/;
          const forbiddenLegacyPath = /(?:^|[-/])(?:mcp|lifecycle)(?:[-./]|$)/i;

          for (const path of requiredPaths) {
            if (!paths.has(path)) throw new Error(`Missing required package file: ${path}`);
          }
          for (const path of paths) {
            if (
              forbiddenLegacyPath.test(path) ||
              (!exactPaths.has(path) &&
                !exactLocaleRuntimePaths.has(path) &&
                !allowedRuntimePath.test(path))
            ) {
              throw new Error(`Unexpected package file: ${path}`);
            }
          }
          NODE
