name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and create the GitHub Release
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic checks
        run: npm run check

      - name: Build the release tarball
        run: npm pack

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes file: $notes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Embassy $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            ./*.tgz

      # npm publish is deliberately NOT automated. Publishing requires the
      # maintainer's explicit local action: npm ci && npm run check && npm publish
