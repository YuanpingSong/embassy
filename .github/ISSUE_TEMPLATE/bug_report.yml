name: Bug report
description: Something in Embassy is not behaving as documented.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Embassy is a same-user gateway between
        Claude Code sessions and Codex CLI agents — please do not paste
        message bodies, prompts, replies, credentials, OAuth material, or
        raw provider output into this form. `embassy status` output never
        contains bodies or native IDs, but it does show aliases, hosts, and
        timestamps — review it before pasting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Exact commands run, and the order they were run in.
      placeholder: |
        1. embassy service install
        2. embassy status  (to read the current agent names; Codex agents are discovered)
        3. printf '%s\n' '[BODY REDACTED]' | embassy send --to advisor@your-host  (run from the agent's own shell)
        4. embassy delivery-status --token dlv_REDACTED
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: embassy-version
    attributes:
      label: Embassy version
      description: "The installed version reported by `embassy --version`."
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: >-
        The version `claude --version` reports. Note if it changed recently,
        and whether `embassy check` passes after the change.
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      description: >-
        The version `codex --version` reports. Note if it changed recently,
        and whether `embassy check` passes after the change.
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Embassy supports macOS only.
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: "`node --version` (Embassy requires Node.js 22 or newer)."
    validations:
      required: true

  - type: textarea
    id: status-output
    attributes:
      label: "`embassy status` output"
      description: >-
        `embassy status` shows aliases, hosts, states, safe codes, and
        timestamps; redact any personal metadata before pasting. Message
        bodies, credentials, and native provider identifiers never appear
        in it.
      render: text

  - type: dropdown
    id: delivery-state
    attributes:
      label: Delivery state observed
      description: >-
        Which phase or terminal outcome did `embassy delivery-status` (or
        `status`) report for the message?
      options:
        - delivered
        - failed
        - cancelled
        - expired
        - ambiguous
        - unconfirmed
        - queued / reserved / armed / accepted (still pending)
        - other / not applicable
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant — logs (stderr only, no bodies), config, environment variables set (names only).
