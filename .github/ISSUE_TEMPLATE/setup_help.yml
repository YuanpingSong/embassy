name: Setup help
description: The quickstart is not working for you.
title: "[setup]: "
labels: ["setup-help"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, re-read the
        [Quickstart](https://github.com/YuanpingSong/embassy#quickstart).
        Do not paste message bodies, prompts, replies, credentials, OAuth
        material, raw provider output, or unreviewed status metadata into
        this form. Embassy never changes a Codex task's native approval or
        sandbox policy and never answers an approval request.

  - type: dropdown
    id: failed-step
    attributes:
      label: Which quickstart step failed?
      options:
        - "embassy service install / embassy serve (starting the broker)"
        - "embassy health / embassy status / embassy tui"
        - "Codex agent not discovered (Codex daemon / App Server)"
        - "embassy register-codex (fallback registration)"
        - "embassy send --to (sending by name)"
        - "embassy send --conversation (answering)"
        - "Native delivery waking Claude Code"
        - "Native delivery waking a Codex task"
        - "SSH federation / embassy peer-stdio"
        - "embassy check (broker-only loopback)"
        - "Install (npm install -g / build from source)"
        - Other
    validations:
      required: true

  - type: textarea
    id: fail-error
    attributes:
      label: Exact fail-closed error line
      description: >-
        Embassy fails closed on identity, protocol, ownership and invalid-state
        boundaries
        rather than guessing. Paste the exact error text (this should not
        contain identifiers or bodies — if it does, redact them and note
        that you redacted).
      render: text
    validations:
      required: true

  - type: input
    id: embassy-version
    attributes:
      label: Embassy version
      description: "The installed version reported by `embassy --version`."
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: "The version `claude --version` reports."
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      description: "The version `codex --version` reports."
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: "`node --version` (Embassy requires Node.js 22 or newer)."
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — sanitized command history, environment variable names set (not values), or reviewed/redacted status output.
