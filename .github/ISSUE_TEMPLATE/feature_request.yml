name: Feature request
description: Suggest an idea for Embassy.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does Embassy fall short?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Embassy to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope-ack
    attributes:
      label: Scope acknowledgment
      description: >-
        Embassy is deliberately scoped: same-user, non-hosted, one Mac or
        the user's own Macs over SSH, and no wider than the daily path. See
        the README's "Safety" section and `docs/DECLINED.md`.
      options:
        - label: >-
            This request keeps Embassy same-user, non-hosted, and without a
            network listener.
          required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
